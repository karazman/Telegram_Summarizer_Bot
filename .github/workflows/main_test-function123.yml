name: Build and deploy Python project to Azure Function App - test-function123

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: test-function123
  PYTHON_VERSION: '3.11'

concurrency:
  group: deploy-test-function123-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Reject GPU dependencies
        run: |
          python -m pip list --format=freeze > resolved-dependencies.txt
          if grep -Ei '^(nvidia-|cuda-|triton(==|$))' resolved-dependencies.txt; then
            echo "GPU dependencies must not be included in the Azure Functions build."
            exit 1
          fi

      - name: Validate Azure Functions application
        run: |
          python -m py_compile function_app.py telegram_handler.py blob_storage.py summarizer.py
          python -m unittest discover -s tests -v

      - name: Package application
        run: |
          zip release.zip \
            function_app.py \
            telegram_handler.py \
            blob_storage.py \
            summarizer.py \
            host.json \
            requirements.txt

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Extract deployment package
        run: |
          mkdir app
          unzip release.zip -d app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FC12F575F4574144AC7BCA6EBD9F476D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_85E4A1F24FE048178A3A4457608E4179 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_049D70C857364CFEB62B98C0F20DE961 }}

      - name: Deploy to Azure Functions
        id: deploy_attempt_1
        continue-on-error: true
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: Production
          package: app
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Wait for Kudu deployment lock
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 90

      - name: Retry Azure Functions deployment
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: Production
          package: app
          scm-do-build-during-deployment: true
          enable-oryx-build: true